repos:
-   repo: local
    hooks:
    -   id: python-tests
        name: Python Tests
        entry: python -m pytest tests/
        language: system
        pass_filenames: false
        always_run: true
    -   id: python-lint
        name: Python Lint
        entry: pylint
        language: system
        types: [python]
        exclude: '^tests/|^venv/|^\.venv/' 